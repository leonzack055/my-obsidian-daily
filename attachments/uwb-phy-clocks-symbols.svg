<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="646" viewBox="0 0 1120 646" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans CJK SC',sans-serif">
  <rect width="1120" height="646" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <path id="blip" d="M-11,0 Q-5.5,-19 0,0 Q5.5,19 11,0" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  </defs>

  <text x="28" y="34" font-size="19" font-weight="700" fill="#0f172a">图 1｜时钟从哪来 · 一小节里怎么装信息</text>

  <!-- ================= ① 时钟链 ================= -->
  <text x="28" y="66" font-size="15" font-weight="700" fill="#1e293b">① 时钟：一条分频链，同时供给三样东西</text>

  <rect x="30" y="80" width="150" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="105" y="104" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">晶体</text>
  <text x="105" y="123" font-size="13" fill="#3730a3" text-anchor="middle">38.4 MHz</text>

  <line x1="180" y1="108" x2="228" y2="108" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="205" y="100" font-size="12" fill="#475569" text-anchor="middle">×13</text>

  <rect x="232" y="80" width="190" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="327" y="104" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">主时钟</text>
  <text x="327" y="123" font-size="13" fill="#1d4ed8" text-anchor="middle">499.2 MHz（2.0032 ns）</text>

  <line x1="422" y1="108" x2="460" y2="108" stroke="#334155" stroke-width="1.6"/>
  <polyline points="460,108 460,58 508,58" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <polyline points="460,108 460,158 508,158" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="484" y="50" font-size="12" fill="#475569" text-anchor="middle">÷8</text>
  <text x="484" y="176" font-size="12" fill="#475569" text-anchor="middle">×128</text>

  <rect x="510" y="34" width="278" height="48" rx="8" fill="#dcfce7" stroke="#059669"/>
  <text x="649" y="54" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">PRF 网格　62.4 MHz</text>
  <text x="649" y="72" font-size="12" fill="#065f46" text-anchor="middle">每 15.6 ns 一个「脉冲落点」</text>

  <rect x="510" y="134" width="278" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="649" y="154" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">时间戳计数器　63.9 GHz</text>
  <text x="649" y="172" font-size="12" fill="#92400e" text-anchor="middle">一格 = 15.65 ps（≈4.7 mm）</text>

  <rect x="30" y="192" width="758" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="46" y="219" font-size="13" fill="#334155">一小节 = 508 个主时钟周期 = 1017.63 ns　⇒　整数倍，所以「落点网格」和「小节边界」永远对齐，不会累积相位误差</text>

  <!-- ================= ② 一小节怎么装信息 ================= -->
  <text x="28" y="266" font-size="15" font-weight="700" fill="#1e293b">② 一个小节（符号）≈ 1 µs：靠「脉冲放哪里」+「整串朝上还是朝下」装比特</text>

  <g>
    <rect x="90" y="280" width="620" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <line x1="400" y1="280" x2="400" y2="324" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="245" y="307" font-size="12" fill="#94a3b8" text-anchor="middle">前半格</text>
    <text x="515" y="307" font-size="12" fill="#94a3b8" text-anchor="middle">后半格</text>
    <use href="#blip" transform="translate(200,302)"/>
    <text x="726" y="307" font-size="13" fill="#1e293b">位置 = 前半　→　位置比特 = 0</text>
  </g>

  <g>
    <rect x="90" y="344" width="620" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <line x1="400" y1="344" x2="400" y2="388" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <use href="#blip" transform="translate(510,366)"/>
    <text x="726" y="371" font-size="13" fill="#1e293b">位置 = 后半　→　位置比特 = 1</text>
  </g>

  <g>
    <rect x="90" y="408" width="620" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <line x1="400" y1="408" x2="400" y2="452" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
    <use href="#blip" transform="translate(200,430) scale(1,-1)" stroke="#ea580c"/>
    <text x="726" y="435" font-size="13" fill="#1e293b">同一位置、整串朝下　→　极性比特翻转</text>
  </g>

  <rect x="90" y="466" width="1000" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="106" y="491" font-size="13" fill="#1e3a8a">每小节比特数 = log₂(落点位置数) ＋ 1（极性）　：两位置 = 2 比特　·　四位置 = 3 比特　·　八位置 = 4 比特（位置数由配置决定，不是永远两个）</text>

  <!-- ================= ③ burst / PRF ================= -->
  <text x="28" y="542" font-size="15" font-weight="700" fill="#1e293b">③ 一小节里的脉冲是一「串」（burst），并不是填满整格</text>

  <rect x="90" y="556" width="620" height="56" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <line x1="90" y1="612" x2="710" y2="612" stroke="#cbd5e1" stroke-width="1.2"/>
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4">
    <line x1="168" y1="556" x2="168" y2="612"/><line x1="256" y1="556" x2="256" y2="612"/>
    <line x1="344" y1="556" x2="344" y2="612"/><line x1="432" y1="556" x2="432" y2="612"/>
    <line x1="520" y1="556" x2="520" y2="612"/><line x1="608" y1="556" x2="608" y2="612"/>
    <line x1="696" y1="556" x2="696" y2="612"/>
  </g>
  <use href="#blip" transform="translate(168,584)"/>
  <use href="#blip" transform="translate(256,584)"/>
  <use href="#blip" transform="translate(344,584)"/>
  <text x="432" y="586" font-size="12" fill="#94a3b8" text-anchor="middle">留空（等回声散去）</text>
  <text x="90" y="636" font-size="12" fill="#475569">PRF 64 MHz ⇒ 每 15.6 ns 一个脉冲位置；burst 连发几个后必须留空，否则自己的多径回声会串进下一格</text>
</svg>
